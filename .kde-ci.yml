Dependencies:
 - 'on': ['Linux']
   'require':
    'frameworks/kconfig': '@latest-kf6'
    'frameworks/kcoreaddons': '@latest-kf6'
    'frameworks/networkmanager-qt': '@latest-kf6'
    'frameworks/solid': '@latest-kf6'
    'libraries/pulseaudio-qt': '@latest-kf6'
    'frameworks/ki18n': '@latest-kf6'
    'frameworks/kdoctools': '@latest-kf6'
    'libraries/ktextaddons': '@latest-kf6'
    'plasma/libplasma': '@latest-kf6'
    'plasma/libkscreen': '@same'

Options:
 require-passing-tests-on: ['Linux']
 cppcheck-arguments: '--enable=warning,style,performance --inline-suppr --suppress=passedByValue --suppress=nullPointer'
 tests-run-in-parallel: True
 cmake-options: '-DWARNINGS_AS_ERRORS=ON'
 enable-lsan: True
